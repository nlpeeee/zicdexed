#
# minidexed.ini
#
# Configured for ZicPixel (Pi Zero 2 W, 1.9" ST7789 170x320, PCM5102 DAC).
# See README.txt for the pin mapping and controls.

# Sound device
SoundDevice=i2s
#SoundDevice=pwm
#SoundDevice=hdmi
SampleRate=48000
#ChunkSize=256
DACI2CAddress=0
ChannelsSwapped=0
# Engine Type ( 1=Modern ; 2=Mark I ; 3=OPL )
EngineType=1
QuadDAC8Chan=0
# Master Volume (0-127)
MasterVolume=64

# MIDI
# USBGadget=1 makes the Pi a USB MIDI device when plugged into a computer
USBGadget=0
MIDIBaudRate=31250
#MIDIThru=umidi1,ttyS1
# MIDIThru2 provides a second thru route. Format: input,output
#MIDIThru2=
# When set to 1, these message types will be ignored by MIDI Thru (both MIDIThru and MIDIThru2)
#MIDIThruIgnoreClock=0
#MIDIThruIgnoreActiveSensing=0
IgnoreAllNotesOff=0
MIDIAutoVoiceDumpOnPC=0
HeaderlessSysExVoices=0
# Program Change enable
#   0 = Ignore all Program Change messages.
#   1 = Respond to Program Change messages.
MIDIRXProgramChange=1
# Program Change mode
#   0 = Only recognise Program Change 0-31.
#   1 = Support 0-127 across four consecutive banks.
# NB: Only relevant if PerformanceSelectChannel=0
ExpandPCAcrossBanks=1
# Program Change action:
#   0 = Program Change messages select voices on the channel associated with each TG.
#   1-16 = Program Change messages on this channel select performances.
#   >16 = Program Change messages on ANY channel select performances.
# NB: In performance mode, all Program Change messages on other channels are ignored.
PerformanceSelectChannel=0

# HD44780 LCD
LCDEnabled=1
LCDPinEnable=0
LCDPinRegisterSelect=0
LCDPinReadWrite=0
LCDPinData4=0
LCDPinData5=0
LCDPinData6=0
LCDPinData7=0
LCDI2CAddress=0x00

# SSD1306 LCD
# For a 128x32 display, set LCDColumns=20; LCDRows=2
# For a 128x64 display, set LCDColumns=20; LCDRows=4
SSD1306LCDI2CAddress=0x0
SSD1306LCDWidth=128
SSD1306LCDHeight=32
SSD1306LCDRotate=0
SSD1306LCDMirror=0

# ST7789 LCD
# SPIBus=0 for any RPi (GPIO 10,11,8,7).
#     Note: Leave blank (default) if no SPI device required.
# Select=0|1 for CE0 or CE1
# Data = GPIO pin number
# Optional: Reset, Backlight = GPIO pin numbers
# Rotation=0,90,180,270
# SmallFont=0 (default), 1
#
# For a 240 wide display set LCDColumns=15 with LCDRows=2
SPIBus=0
# This screen has no CS line, so it needs SPI mode 3 (zicBox uses mode 3 too)
SPIMode=3
SPIClockKHz=15000
ST7789Enabled=1
ST7789Data=3
ST7789Select=0
ST7789Reset=17
ST7789Backlight=
ST7789Width=320
ST7789Height=170
ST7789Rotation=180
ST7789SmallFont=0

# Default is 16x2 display (e.g. HD44780)
LCDColumns=20
LCDRows=4

# GPIO Button Navigation
# Off: with ZicUI=1 the ZicDexed code reads all 12 keys itself (see ZicUI below).
#  Any buttons set to 0 will be ignored
ButtonPinPrev=0
ButtonActionPrev=
ButtonPinNext=0
ButtonActionNext=
ButtonPinBack=0
ButtonActionBack=click
ButtonPinSelect=0
ButtonActionSelect=click
ButtonPinHome=0
ButtonActionHome=click
ButtonPinShortcut=0
# (Shortcut doesn't have an action)

# GPIO Program/Bank/TG Selection
#  Any buttons set to 0 will be ignored
ButtonPinPgmUp=0
ButtonActionPgmUp=click
ButtonPinPgmDown=0
ButtonActionPgmDown=click
ButtonPinBankUp=0
ButtonActionBankUp=
ButtonPinBankDown=0
ButtonActionBankDown=
ButtonPinTGUp=0
ButtonActionTGUp=click
ButtonPinTGDown=0
ButtonActionTGDown=click

# Timeouts in milliseconds for double click and long press
DoubleClickTimeout=400
LongPressTimeout=400

# MIDI Button Navigation
#  Specify MIDI CC to act as a button (0 = ununsed, so don't use CC 0)
#  NB: Off < 64 < ON
# CC channel: 0=OFF; 1-16 MIDI Ch; >16 Omni
# If MIDIButtonNotes>0 then treat MIDIButton numbers as MIDI
# Note numbers, triggered with NoteOn/NoteOff, not CC numbers.
MIDIButtonCh=17
MIDIButtonNotes=0
# Arrow left
MIDIButtonPrev=46
# Arrow right
MIDIButtonNext=47
# Arrow up
MIDIButtonBack=48
# Arrow down
MIDIButtonSelect=49
# Home button
MIDIButtonHome=50
MIDIButtonPgmUp=51
MIDIButtonPgmDown=52
MIDIButtonBankUp=53
MIDIButtonBankDown=54
MIDIButtonTGUp=55
MIDIButtonTGDown=56

# KY-040 Rotary Encoder (stock single encoder; off, ZicUI reads all four)
EncoderEnabled=0
EncoderPinClock=26
EncoderPinData=13
# Encoder resolution: full, half, or quarter (default: full)
EncoderResolution=full

# Debug
MIDIDumpEnabled=0
ProfileEnabled=0

# Network
NetworkEnabled=1
NetworkDHCP=1
# NetworkType ( wlan ; ethernet )
NetworkType=wlan
NetworkHostname=ZicDexed
NetworkIPAddress=0
NetworkSubnetMask=0
NetworkDefaultGateway=0
NetworkDNSServer=0
NetworkFTPEnabled=1
NetworkSyslogEnabled=0
NetworkSyslogServerIPAddress=0
# UDP MIDI (optional)
#UDPMIDIEnabled=0
#UDPMIDIIPAddress=255.255.255.255    ; destination IP for UDP MIDI (default: broadcast)
# Note: set UDPMIDIIPAddress=0.0.0.0 to disable UDP MIDI transmit
# UDP MIDI uses port 1999 by default.

# Performance
PerformanceSelectToLoad=0

# ZicDexed
# ZicUI=1: custom screens driven by all 12 keys and all 4 encoders (see docs/ui-design.md).
# ZicUI=0: stock MiniDexed text menu.
ZicUI=1
# Serial (DIN) MIDI off: MIDI comes in over USB, and GPIO 14/15 become keys r and f.
SerialMIDIEnabled=0
# Reverse an encoder's direction: bit 0 = encoder 1 ... bit 3 = encoder 4 (e.g. 5 = encoders 1 and 3).
ZicEncoderInvert=0
